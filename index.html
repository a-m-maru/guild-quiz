  good:['話をよく聞き、相手の状態に気づける','全体を見渡して必要な支えを出せる','時間をかけて深い信頼を築ける'],
  bad:['自分のことを後回しにしがち','対立を避けて言うべきことを飲み込む','慎重すぎて動き出しが遅い'],
  mate:'勇者',mateWhy:'あなたが背中を支えるほど、勇者は遠くまで進めます。',
  clash:'魔法使い',clashWhy:'理屈を優先する魔法使いに、気持ちが伝わりにくいことがあります。'}
};
/* axis X: D=動 / S=静   axis Y: J=我 / K=絆 */
const QX=[
 ['見知らぬ洞窟の前に着きました。','とりあえず松明を掲げて、中に入ってみる。','入口の岩肌や足跡を調べてから入る。'],
 ['宿屋で作戦会議をします。','細かい計画より、動きながら決めたい。','地図と情報が揃うまで動きたくない。'],
 ['目の前に古びた宝箱があります。','罠かもしれなくても、まず開けてみる。','罠の有無を確かめるまで開けない。'],
 ['強敵に出くわしました。','先手を取って、流れをつかみにいく。','相手の動きを観察して、弱点を探る。'],
 ['旅の休息日、どう過ごしますか。','街を歩き回って、新しい出会いを探す。','宿にこもって、本を読み記録をつける。'],
 ['道が二手に分かれています。','直感で選び、違ったら引き返す。','情報を集めてから、いちばん良い道を選ぶ。'],
 ['自分の得意なことはどちらに近いですか。','予想外の事態でも、その場で対応できる。','起こりうる事態を想定して、備えておける。'],
 ['封印された古文書を見つけました。','手に取って、まず試しに唱えてみる。','内容を完全に理解するまで、封を解かない。']
];
const QY=[
 ['莫大な報酬の依頼です。ただし、ある村を見捨てることになります。','自分が納得できるかどうかで決める。','村の人々を守れる道を選ぶ。'],
 ['パーティの方針が割れました。','自分が正しいと思う道を貫く。','全員が納得できる落としどころを探す。'],
 ['あなたが冒険に出る、いちばんの理由は。','自分の力を試したい。まだ見ぬ世界が見たい。','誰かの笑顔や、平和を守りたい。'],
 ['あなたにとっての誓いとは。','誰にも縛られず、自分の掟で生きること。','仲間や教えとの約束を破らないこと。'],
 ['仲間が傷つき、あなたも限界です。','自ら道を切り開くことが、最善の助けだと思う。','何を置いても、仲間の手当てを優先する。'],
 ['称号をひとつ授けられるなら。','「誰も辿り着けなかった者」','「皆に頼られた者」'],
 ['掟と、目の前で困っている人の願いが食い違います。','自分の判断で、迷わず動く。','掟を守りつつ、救う方法を探す。'],
 ['野営の夜、ひとりで見張りに立ちます。','静かな時間に、自分の内側と向き合う。','眠る仲間の顔を見て、明日の無事を祈る。']
];
const QS=[];
for(let i=0;i<8;i++){
  QS.push({ax:'X',s:QX[i][0],a:{t:QX[i][1],p:'D'},b:{t:QX[i][2],p:'S'},flip:i%3===1});
  QS.push({ax:'Y',s:QY[i][0],a:{t:QY[i][1],p:'J'},b:{t:QY[i][2],p:'K'},flip:i%3===0});
}
const N=QS.length;
let idx=0, ans=[];
const app=document.getElementById('app');

/* ===== 収益化の設定：公開前にここを書き換えてください =====
   adsenseClient : AdSenseの発行者ID（例 'ca-pub-1234567890123456'）
   slots.start   : スタート画面用の広告ユニットID（数字）
   slots.result  : 結果画面用の広告ユニットID（数字）
   adsenseClient が空のあいだは、広告もプライバシーポリシーも表示されません。 */
/* ===== 詳細版の設定 =====
   purchaseUrl : 販売ページのURL（BOOTH、note、Stripe決済リンクなど）。空だと「販売準備中」と表示されます。
   priceLabel  : ボタンに表示する価格の文字 */
const CONFIG={adsenseClient:'ca-pub-5139487982886257',slots:{start:'',result:''},
  purchaseUrl:'https://guild-quiz.booth.pm/items/8923047',priceLabel:'390円'};
const ADS_ON=!!CONFIG.adsenseClient;
if(ADS_ON){
  const sc=document.createElement('script');
  sc.async=true; sc.crossOrigin='anonymous';
  sc.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+encodeURIComponent(CONFIG.adsenseClient);
  document.head.appendChild(sc);
}
function adHTML(name){
  if(!ADS_ON||!CONFIG.slots[name])return '';
  return `<div class="ad"><small>広告</small><ins class="adsbygoogle" style="display:block" data-ad-client="${CONFIG.adsenseClient}" data-ad-slot="${CONFIG.slots[name]}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;
}
function fillAds(){
  if(!ADS_ON)return;
  app.querySelectorAll('ins.adsbygoogle').forEach(()=>{
    try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  });
}
function policyHTML(){
  if(!ADS_ON)return '';
  return `<details class="policy"><summary>プライバシーポリシー</summary>
    <p>このサイトでは、診断の回答内容を収集・保存しません。回答はお使いのブラウザの中だけで処理されます。</p>
    <p>広告配信にGoogleアドセンスを利用しています。Googleなどの第三者配信事業者は、Cookieを使用して、ユーザーの過去のアクセス情報に基づく広告を配信します。広告の設定は<a href="https://adssettings.google.com" target="_blank" rel="noopener">Googleの広告設定</a>で変更できます。詳しくは<a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">Googleの広告に関するポリシー</a>をご覧ください。</p>
  </details>`;
}

function mapHTML(active){
  const order=[['DJ','SJ'],['DK','SK']];
  const cell=k=>{
    const t=TYPES[k];
    const state=active?(k===active?' on':' dim'):'';
    return `<div class="cell t-${t.cls}${state}">${ICON[k]}<b>${t.name}</b><small>${t.tag}</small></div>`;
  };
  return `<div class="map" role="group" aria-label="職業マップ">
    <div></div><div class="ch">動く（即行動）</div><div class="ch">静かに（見極め）</div>
    <div class="rh">我　自分の道</div>${cell('DJ')}${cell('SJ')}
    <div class="rh">絆　みんなのため</div>${cell('DK')}${cell('SK')}
  </div>`;
}

const JOB_CODES=['DJ','DK','SJ','SK'];
function showStart(){
  idx=0; ans=[];
  document.body.dataset.job=JOB_CODES[Math.floor(Math.random()*JOB_CODES.length)];
  app.innerHTML=`<section class="start">
    <div class="eyebrow">冒険者ギルド　登録窓口</div>
    <h1>あなたの職業は、勇者か聖職者か魔法使いか聖騎士か。</h1>
    <p class="lead">冒険のひとコマを描いた16の質問に、直感で答えてください。所要時間は約3分です。答えに正解はありません。</p>
    <div class="go"><button class="btn" id="go">検査をはじめる</button></div>
    <div class="map-title">4つの職業マップ</div>
    ${mapHTML(null)}
    ${adHTML('start')}
    ${policyHTML()}
  </section>`;
  document.getElementById('go').onclick=showQ;
  fillAds();
}

function showQ(justAnswered){
  document.body.dataset.job=JOB_CODES[idx%JOB_CODES.length];
  const q=QS[idx];
  const pair=q.flip?[q.b,q.a]:[q.a,q.b];
  const pips=QS.map((_,i)=>{
    let c=i<idx?'done':i===idx?'now':'';
    if(justAnswered&&i===idx-1) c+=' pop';
    return `<i class="${c}"></i>`;
  }).join('');
  app.innerHTML=`<section>
    <div class="qhead"><span class="eyebrow">冒険者ギルド　適性検査</span><span class="qnum">問 ${idx+1} / ${N}</span></div>
    <div class="pips" aria-hidden="true">${pips}</div>
    <h2 class="scene">${q.s}</h2>
    <div class="opts">${pair.map(o=>`<button class="opt" data-p="${o.p}">${o.t}</button>`).join('')}</div>
    <button class="back" id="back" ${idx===0?'disabled':''}>← ひとつ前の質問に戻る</button>
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      b.classList.add('picked');
      app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      ans[idx]=b.dataset.p;
      setTimeout(()=>{ idx++; idx<N?showQ(true):showResult(); },220);
    };
  });
  document.getElementById('back').onclick=()=>{ if(idx>0){idx--;showQ();} };
  window.scrollTo(0,0);
}

function calc(){
  let d=0,j=0,lastX='',lastY='';
  QS.forEach((q,i)=>{
    const p=ans[i];
    if(q.ax==='X'){ if(p==='D')d++; lastX=p; }
    else { if(p==='J')j++; lastY=p; }
  });
  const X=d>4?'D':d<4?'S':lastX;
  const Y=j>4?'J':j<4?'K':lastY;
  return {key:X+Y,d,j};
}

function bar(l,r,pct){
  return `<div><div class="bar-l"><span>${l} ${pct}%</span><span>${r} ${100-pct}%</span></div>
  <div class="track"><div class="fill" data-w="${pct}"></div></div></div>`;
}

function showResult(){
  const {key,d,j}=calc();
  const t=TYPES[key];
  document.body.dataset.job=key;
  const dp=Math.round(d/8*100), jp=Math.round(j/8*100);
  const mateKey=Object.keys(TYPES).find(k=>TYPES[k].name===t.mate);
  app.innerHTML=`<section class="t-${t.cls}">
    <div class="res-top">
      <div class="eyebrow">検査の結果、あなたの職業は</div>
      <div class="badge">${ICON[key]}</div>
      <h1>${t.name}</h1>
      <div class="tag">${t.tag}</div>
      <p class="quote">${t.quote}</p>
    </div>
    <div class="sec">${mapHTML(key)}</div>
    <div class="sec"><span class="lab">傾向</span><h3>4つの職業を分ける2つの軸</h3>
      <div class="bars">${bar('動く','静かに',dp)}${bar('自分の道（我）','みんなのため（絆）',jp)}</div>
    </div>
    <div class="sec"><span class="lab">人物像</span><h3>${t.name}のあなた</h3><p>${t.desc}</p></div>
    <div class="sec two">
      <div><span class="lab">強み</span><ul class="list">${t.good.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div><span class="lab">弱点</span><ul class="list">${t.bad.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    ${adHTML('result')}
    <div class="sec two">
      <div class="pair"><span class="k">最高の相棒</span><b>${t.mate}</b><p>${t.mateWhy}</p></div>
      <div class="pair"><span class="k">ぶつかりやすい相手</span><b>${t.clash}</b><p>${t.clashWhy}</p></div>
    </div>
    ${premiumHTML()}
    <div class="foot row">
      <button class="btn ghost" id="editLast">最後の質問に戻ってやり直す</button>
      <button class="btn" id="again">最初からもう一度受ける</button>
      <a class="btn ghost" id="share" target="_blank" rel="noopener">Xで共有</a>
      <button class="btn ghost" id="copy">結果をコピー</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <p class="note">娯楽用の診断です。実際の性格や適性を測るものではありません。</p>
    ${policyHTML()}
  </section>`;
  document.getElementById('editLast').onclick=()=>{ idx=N-1; showQ(); };
  document.getElementById('again').onclick=showStart;
  fillAds();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    app.querySelectorAll('.fill').forEach(el=>{ el.style.width=el.dataset.w+'%'; });
  }));
  const shareText=`ギルド適性検査の結果は「${t.name}（${t.tag}）」でした！ #ギルド適性検査`;
  document.getElementById('share').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText)+'&url='+encodeURIComponent(location.href.split('#')[0]);
  document.getElementById('copy').onclick=()=>{
    const text=`ギルド適性検査の結果：${t.name}（${t.tag}）\n動く${dp}% / 静かに${100-dp}%、自分の道${jp}% / みんなのため${100-jp}%\n${t.quote}`;
    const toast=document.getElementById('toast');
    const ok=()=>toast.textContent='結果をコピーしました。';
    const ng=()=>{toast.textContent='コピーできませんでした。次の文章を選択してコピーしてください：'+text.replace(/\n/g,' ');};
    try{ navigator.clipboard.writeText(text).then(ok,ng); }catch(e){ ng(); }
  };
  window.scrollTo(0,0);
}

/* ===== 詳細版（購入ページへの案内） ===== */
function premiumHTML(){
  const buy=CONFIG.purchaseUrl
    ? `<a class="btn" href="${CONFIG.purchaseUrl}" target="_blank" rel="noopener">詳細版を購入する（${CONFIG.priceLabel}）</a>`
    : `<button class="btn" disabled>販売準備中</button>`;
  return `<div class="sec"><div class="premium">
    <span class="paid">詳細版</span>
    <h3>もっと深く知りたい人へ：16タイプ診断＋詳細レポート</h3>
    <p>この結果に加えて、20問のチェックで4つの職業がさらに16のタイプに分かれます。</p>
    <ul class="list">
      <li>16タイプのうち、あなたの系統がわかります</li>
      <li>恋愛・人間関係、仕事・学び、戦い方、成長のヒントの詳しいレポート</li>
      <li>印刷して使えるPDF版と、その場でタップして診断できるWeb版の両方をお届けします</li>
    </ul>
    <div class="row">${buy}</div>
  </div></div>`;
}

showStart();
</script>
</body>
</html>
